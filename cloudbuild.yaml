# cloudbuild.yaml — CivicPulse CI/CD
# Triggered on every push to main.
# Builds both images and deploys to Cloud Run.

steps:
  # ── Backend: build + push ──────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-backend
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/civicpulse/backend:$COMMIT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/civicpulse/backend:latest
      - ./backend
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/docker'
    id: push-backend
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/civicpulse/backend
    waitFor: ['build-backend']

  # ── Frontend: build + push ─────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-frontend
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/civicpulse/frontend:$COMMIT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/civicpulse/frontend:latest
      - --build-arg
      - VITE_API_BASE_URL=$_BACKEND_URL
      - ./frontend
    waitFor: ['-']

  - name: 'gcr.io/cloud-builders/docker'
    id: push-frontend
    args:
      - push
      - --all-tags
      - $_REGION-docker.pkg.dev/$PROJECT_ID/civicpulse/frontend
    waitFor: ['build-frontend']

  # ── Deploy backend to Cloud Run ────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - civicpulse-backend
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/civicpulse/backend:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5
      - --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,FIREBASE_PROJECT_ID=FIREBASE_PROJECT_ID:latest,FIREBASE_PRIVATE_KEY=FIREBASE_PRIVATE_KEY:latest,FIREBASE_CLIENT_EMAIL=FIREBASE_CLIENT_EMAIL:latest
      - --set-env-vars=APP_ENV=production,ALLOWED_ORIGINS=$_FRONTEND_URL
    waitFor: ['push-backend']

  # ── Deploy frontend to Cloud Run ───────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - civicpulse-frontend
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/civicpulse/frontend:$COMMIT_SHA
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
    waitFor: ['push-frontend']

substitutions:
  _REGION: asia-south1     # Mumbai — closest to Jaipur
  _BACKEND_URL: https://civicpulse-backend-xxxx-el.a.run.app
  _FRONTEND_URL: https://civicpulse-frontend-xxxx-el.a.run.app

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/civicpulse/backend:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/civicpulse/frontend:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
