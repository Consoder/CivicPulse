name: CivicPulse Browser Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/browser-smoke.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    env:
      DEMO_MODE: "true"
      APP_ENV: "development"
      GROQ_API_KEY: "demo-placeholder"
      FIREBASE_PROJECT_ID: "demo-placeholder"
      FIREBASE_PRIVATE_KEY: "demo-placeholder"
      FIREBASE_CLIENT_EMAIL: "demo@example.invalid"
      VITE_API_BASE_URL: "http://127.0.0.1:8000"
      VITE_FIREBASE_API_KEY: "demo-placeholder"
      VITE_FIREBASE_AUTH_DOMAIN: "demo-project.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "demo-project"
      VITE_FIREBASE_STORAGE_BUCKET: "demo-project.appspot.com"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456"
      VITE_FIREBASE_APP_ID: "1:123456:web:demo"
      CIVICPULSE_SCREENSHOT: "/tmp/civicpulse-home.png"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend, browser, frontend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt playwright
          python -m playwright install --with-deps chromium
          cd frontend && npm ci --no-audit --no-fund
      - name: Start backend and frontend in demo mode
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/civicpulse-api.log 2>&1 &
          cd ../frontend
          nohup npm run dev -- --host 127.0.0.1 > /tmp/civicpulse-vite.log 2>&1 &
      - name: Run Chromium browser smoke test
        run: python backend/tests/browser_smoke.py
      - name: Upload browser screenshot on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civicpulse-browser-smoke
          path: |
            /tmp/civicpulse-home.png
            /tmp/civicpulse-api.log
            /tmp/civicpulse-vite.log
          if-no-files-found: ignore
