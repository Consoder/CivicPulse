name: CivicPulse CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend demo-mode API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEMO_MODE: "true"
      APP_ENV: "development"
      GROQ_API_KEY: "demo-placeholder"
      FIREBASE_PROJECT_ID: "demo-placeholder"
      FIREBASE_PRIVATE_KEY: "demo-placeholder"
      FIREBASE_CLIENT_EMAIL: "demo@example.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run end-to-end demo API tests
        run: python -m pytest -q tests/test_demo_e2e.py

  frontend:
    name: React production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
